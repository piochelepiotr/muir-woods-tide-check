name: Refresh data and publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Fetch public data
        run: python3 scripts/fetch_data.py
        continue-on-error: true
      - name: Fetch probabilistic total-water guidance
        run: python3 scripts/fetch_forecast.py
      - uses: actions/checkout@v4
        with:
          ref: data-history
          path: .history
      - name: Preserve timestamped road reports
        run: python3 scripts/archive_reports.py .history
      - name: Save report history
        working-directory: .history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add days index.json forecast-cycles
          if ! git diff --cached --quiet; then
            git commit -m 'Archive public road and tide reports'
            git push origin HEAD:data-history
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
